import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Load local signing properties if available
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("../AndroidSigning/keystore.properties")

if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

// Check signing configuration
def requiredSigningProperties = [
    'storeFile',
    'storePassword',
    'keyAlias',
    'keyPassword'
]

def hasReleaseSigning = requiredSigningProperties.every { propertyName ->
    def value = keystoreProperties.getProperty(propertyName)
    value != null && !value.trim().isEmpty()
}

// Require signing properties only for Release builds
def releaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (releaseTaskRequested && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing configuration is missing. " +
        "Create your local keystore.properties file."
    )
}

kotlin {
    compilerOptions {
        jvmTarget.set(JvmTarget.JVM_1_8)
    }
}

android {
    namespace 'com.metcode'
    compileSdk 34

    defaultConfig {
        applicationId "com.metcode"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}