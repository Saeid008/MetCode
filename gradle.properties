org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Avoids "Could not connect to Kotlin compile daemon" on machines where a
# firewall/antivirus blocks the daemon's local loopback socket.
kotlin.compiler.execution.strategy=in-process

# If downloads keep failing with "Connection reset by peer" even though curl
# works, it's usually antivirus/firewall SSL inspection breaking Gradle's
# Java-based HTTPS client specifically (a very common Windows issue). Try
# forcing TLS 1.2 first -- some inspection proxies mishandle TLS 1.3:
systemProp.https.protocols=TLSv1.2,TLSv1.3

# If you're behind a company/VPN proxy, uncomment and fill these in
# (ask your network admin for the proxy host/port if unsure):
# systemProp.https.proxyHost=proxy.example.com
# systemProp.https.proxyPort=8080
# systemProp.http.proxyHost=proxy.example.com
# systemProp.http.proxyPort=8080
